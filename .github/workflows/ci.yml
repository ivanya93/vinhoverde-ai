name: CI

# Every push / PR: unit tests on synthetic data. No secrets, no services, ~1 minute.
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies (same pins as the containers)
        run: pip install -r docker/requirements-notebook.txt
      - name: Run tests
        run: pytest tests/ -v
